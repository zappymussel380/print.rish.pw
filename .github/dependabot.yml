version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 is the native port, and typescript-eslint does not support it:
      # 8.67.0 peers `typescript >=4.8.4 <6.1.0`. The repository is on 6.0.3, which
      # is inside that ceiling. Revisit once typescript-eslint ships a release that
      # accepts 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Node 26 is not LTS until October 2026; revisit after it enters LTS.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # Ubuntu majors are no longer ignored: the image-level Orca slicing smoke
      # test has been run against 26.04 and passes, and the base is now on that
      # LTS. Note Dependabot ranks purely by version number and will happily
      # propose interim releases (24.10, 25.04, 25.10) that are already end of
      # life — only LTS bases belong here.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
