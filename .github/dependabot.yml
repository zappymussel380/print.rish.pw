version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Prisma 7 needs a deliberate paired migration; revisit when prisma and
      # @prisma/client can be upgraded together (the current PR bumps only the CLI).
      - dependency-name: prisma
        update-types: ["version-update:semver-major"]
      # Prisma 7 needs a deliberate paired migration; revisit when the client and
      # CLI migration is scheduled and verified against the integration fences.
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 uses the native port while toolchain compatibility is still
      # immature; revisit once the repository's lint/build/test stack supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Node 26 is not LTS until October 2026; revisit after it enters LTS.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # Ubuntu majors are no longer ignored: the image-level Orca slicing smoke
      # test has been run against 26.04 and passes, and the base is now on that
      # LTS. Note Dependabot ranks purely by version number and will happily
      # propose interim releases (24.10, 25.04, 25.10) that are already end of
      # life — only LTS bases belong here.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
