name: Security and verification

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ORIGIN: https://example.invalid
  DATABASE_URL: postgresql://print_web:ci-runtime-password-00000000000000000000@localhost:5432/print
  REDIS_URL: redis://:ci-redis-password-000000000000000000000@localhost:6379
  SESSION_SECRET: ci-session-secret-000000000000000000000000000000000000000000000000
  ADMIN_PASSWORD_HASH: $2b$12$LQv3c1yqBWXv6LoYh5pCjOaFh5SwmP7j8WbWm5CDhP5Rw1G2uQ0eW

jobs:
  repository-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan dependencies, configuration, and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://print_web:ci-web-password-00000000000000000000000000@127.0.0.1:5432/print_integration
      REDIS_URL: redis://:ci-redis-password-000000000000000000000@127.0.0.1:6379
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: print_owner
          POSTGRES_PASSWORD: ci-owner-password-000000000000000000000000
          POSTGRES_DB: print_integration
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U print_owner -d print_integration"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 5s
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        env:
          REDISCLI_AUTH: ci-redis-password-000000000000000000000
        command: redis-server --requirepass ci-redis-password-000000000000000000000
        ports:
          - "127.0.0.1:6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 5s
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify proxy trust guard
        shell: bash
        run: |
          set -euo pipefail
          valid=(
            "192.0.2.10"
            "192.0.2.10/32"
            "2001:db8::10"
            "2001:db8::10/128"
            "::ffff:192.0.2.10/128"
          )
          invalid=(
            ""
            "192.0.2.0/24"
            "2001:db8::/64"
            "999.0.0.1"
            "proxy.internal"
            "192.0.2.10;include bad.conf"
            $'192.0.2.10\nset_real_ip_from 0.0.0.0/0;'
          )
          for value in "${valid[@]}"; do
            TRUSTED_PROXY_CIDR="$value" docker/proxy/05-validate-trusted-proxy.sh >/dev/null
          done
          for value in "${invalid[@]}"; do
            if TRUSTED_PROXY_CIDR="$value" docker/proxy/05-validate-trusted-proxy.sh >/dev/null 2>&1; then
              echo "Proxy validator accepted an unsafe value" >&2
              exit 1
            fi
          done

          docker run --rm --add-host web:127.0.0.1 \
            -e TRUSTED_PROXY_CIDR=192.0.2.10/32 \
            -v "$PWD/docker/proxy/05-validate-trusted-proxy.sh:/docker-entrypoint.d/05-validate-trusted-proxy.sh:ro" \
            -v "$PWD/docker/proxy/nginx.conf:/etc/nginx/templates/default.conf.template:ro" \
            nginx:alpine@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa nginx -t

      - name: Verify proxy request-body limits
        # `nginx -t` cannot see this class of mistake: a route that accepts large
        # bodies but was never granted an allowance is valid configuration that
        # returns 413 for every real payload, with no application log to explain
        # it because the request never reaches the app. That is how the showcase
        # photo upload shipped broken.
        env:
          NGINX_IMAGE: nginx:alpine@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa
        run: docker/proxy/body-limits-test.sh

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.12.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify PostgreSQL client
        run: psql --version

      - name: Install OpenCASCADE DRAW (STEP converter)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends occt-draw
          # DRAW dlopens plugins by unversioned soname; Ubuntu ships those
          # symlinks only in the -dev packages. Derive the versioned suffix
          # rather than hardcoding it: it tracks the OpenCASCADE release, and
          # an unmatched glob would be passed through literally, creating a
          # dangling "libTK*.so" link and leaving the STEP leg broken while the
          # job still went green. Mirrors docker/worker.Dockerfile.
          linked=0
          for f in /usr/lib/x86_64-linux-gnu/libTK*.so.*; do
            [ -e "$f" ] || continue
            target="${f%%.so.*}.so"
            [ -e "$target" ] || sudo ln -sf "$f" "$target"
            linked=$((linked + 1))
          done
          if [ "$linked" -eq 0 ] || [ ! -e /usr/lib/x86_64-linux-gnu/libTKXSDRAW.so ]; then
            echo "FATAL: OpenCASCADE plugin symlinks missing; STEP leg would break" >&2
            exit 1
          fi

      - name: Generate Prisma client
        run: pnpm --filter @print/db generate

      - name: Deploy integration database schema
        env:
          DATABASE_URL: postgresql://print_owner:ci-owner-password-000000000000000000000000@127.0.0.1:5432/print_integration
        run: pnpm --filter @print/db migrate:deploy

      - name: Provision integration database roles
        env:
          MIGRATION_DATABASE_URL: postgresql://print_owner:ci-owner-password-000000000000000000000000@127.0.0.1:5432/print_integration
          WEB_DATABASE_URL: postgresql://print_web:ci-web-password-00000000000000000000000000@127.0.0.1:5432/print_integration
          WORKER_DATABASE_URL: postgresql://print_worker:ci-worker-password-0000000000000000000000@127.0.0.1:5432/print_integration
        run: node apps/web/scripts/provision-database.mjs

      - name: Audit dependencies
        run: pnpm audit --audit-level low

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Integration test
        env:
          MIGRATION_DATABASE_URL: postgresql://print_owner:ci-owner-password-000000000000000000000000@127.0.0.1:5432/print_integration
          WORKER_DATABASE_URL: postgresql://print_worker:ci-worker-password-0000000000000000000000@127.0.0.1:5432/print_integration
        run: pnpm --filter @print/web test:integration

      - name: Full HTTP quotation flow
        shell: bash
        env:
          APP_ORIGIN: http://127.0.0.1:3000
          REDIS_URL: redis://:ci-redis-password-000000000000000000000@127.0.0.1:6379/1
          WORKER_DATABASE_URL: postgresql://print_worker:ci-worker-password-0000000000000000000000@127.0.0.1:5432/print_integration
          STORAGE_RESERVE_MB: "1"
          MAX_UPLOAD_MB: "10"
          MAX_SESSION_UPLOAD_MB: "20"
          UPLOAD_WINDOW_MB: "20"
          WORKER_CONCURRENCY: "1"
        run: |
          set -euo pipefail
          flow_root="$(mktemp -d)"
          web_log="$flow_root/web.log"
          worker_log="$flow_root/worker.log"
          web_pid=""
          worker_pid=""

          cleanup() {
            status=$?
            trap - EXIT
            for pid in "$web_pid" "$worker_pid"; do
              if [[ -n "$pid" ]]; then kill -TERM -- "-$pid" 2>/dev/null || true; fi
            done
            for _ in {1..50}; do
              alive=0
              for pid in "$web_pid" "$worker_pid"; do
                if [[ -n "$pid" ]] && kill -0 -- "-$pid" 2>/dev/null; then alive=1; fi
              done
              if (( alive == 0 )); then break; fi
              sleep 0.1
            done
            for pid in "$web_pid" "$worker_pid"; do
              if [[ -n "$pid" ]]; then kill -KILL -- "-$pid" 2>/dev/null || true; fi
            done
            for pid in "$web_pid" "$worker_pid"; do
              if [[ -n "$pid" ]]; then wait "$pid" 2>/dev/null || true; fi
            done
            if (( status != 0 )); then
              tail -n 200 "$web_log" "$worker_log" >&2 || true
            fi
            rm -rf "$flow_root"
            exit "$status"
          }
          trap cleanup EXIT

          export UPLOAD_DIR="$flow_root/uploads"
          export PDF_DIR="$flow_root/pdfs"
          export SLICE_WORK_DIR="$flow_root/slice-jobs"

          setsid pnpm --filter @print/web dev >"$web_log" 2>&1 &
          web_pid=$!
          setsid env \
            NODE_ENV=test \
            STUB_SLICER=true \
            ORCA_BIN=/definitely-not-installed/orca \
            DATABASE_URL="$WORKER_DATABASE_URL" \
            pnpm --filter @print/worker start >"$worker_log" 2>&1 &
          worker_pid=$!

          STUB_SLICER=true pnpm --filter @print/web test:flow

      - name: Build
        run: pnpm build

  # Everything above this point runs against the source tree. Nothing in it
  # builds a container image or executes one, and twice in one day that let a
  # deploy-breaking change through a fully green pipeline:
  #
  #   * Next 16 type-checked apps/web/test-integration, which imports
  #     ../../worker/src — present in the monorepo, absent from the web image's
  #     build context. `pnpm build` passed; `docker build` failed.
  #   * Every production slice failed for nine hours because OrcaSlicer staged
  #     its 3MF export through a shared /tmp path owned by whichever uid ran it
  #     first. Only the real worker image, running the real bundle and dropping
  #     to the real slicer uid, takes that path at all.
  #
  # So this job builds the actual images and runs the actual stack, then drives
  # one real slice through the public API. `docker compose up` is what makes it
  # meaningful: the worker image's CMD is `node dist/index.js`, so this is also
  # the only check that ever executes the shipped bundle rather than tsx on the
  # sources.
  images:
    name: Container images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # docker-compose.yml pins `name: print`, so every compose command targets
      # the production project regardless of directory. Harmless on a throwaway
      # runner, but the teardown below ends in `down -v`, and these steps get
      # copied to real machines when someone reproduces a CI failure by hand.
      # Overriding the project name means that copy destroys nothing.
      COMPOSE_PROJECT_NAME: print-ci
      # Throwaway credentials for a stack that lives as long as this job.
      #
      # These MUST be set here rather than written to a .env file. Compose
      # resolves ${VAR} from the process environment before it consults .env, and
      # the workflow-level env block above already defines DATABASE_URL,
      # APP_ORIGIN, SESSION_SECRET and ADMIN_PASSWORD_HASH for every job — so a
      # .env is silently outranked, and the stack comes up pointed at
      # localhost:5432 and https://example.invalid. Job-level env outranks
      # workflow-level, which is what makes these authoritative.
      #
      # Values taken from the environment are also used verbatim, so the bcrypt
      # hash keeps its single '$' here. Only .env files need it doubled, which is
      # the rule .env.example documents for deployments.
      POSTGRES_USER: print
      POSTGRES_PASSWORD: ci-postgres-password-0000000000000000
      POSTGRES_DB: print
      DATABASE_URL: postgresql://print_web:ci-web-password-00000000000000000000000000@postgres:5432/print
      MIGRATION_DATABASE_URL: postgresql://print:ci-postgres-password-0000000000000000@postgres:5432/print
      WORKER_DATABASE_URL: postgresql://print_worker:ci-worker-password-0000000000000000000000@postgres:5432/print
      REDIS_PASSWORD: ci-redis-password-000000000000000000000
      SESSION_SECRET: ci-session-secret-000000000000000000000000000000000000000000000000
      ADMIN_PASSWORD_HASH: $2b$12$LQv3c1yqBWXv6LoYh5pCjOaFh5SwmP7j8WbWm5CDhP5Rw1G2uQ0eW
      # The web image requires an https APP_ORIGIN, while inside the compose
      # network the container is reached over plain http — hence the smoke test
      # taking the address and the Origin header separately. Requests go straight
      # to web:3000 because nginx trusts exactly one transport peer and the
      # runner's bridge address is not knowable before the stack is up; the
      # proxy's own guard is covered by the verify job's trust-guard step.
      APP_ORIGIN: https://web:3000
      TRUSTED_PROXY_CIDR: 127.0.0.1/32
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim runner disk
        # The worker image carries Ubuntu, OpenCASCADE and the OrcaSlicer
        # AppImage; the runner's preinstalled toolchains are the easiest few GB
        # to give back and none of them are used here.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Build images
        # The web build is where a monorepo-only module resolution shows up, and
        # the worker build is where the Dockerfile's OpenCASCADE symlink
        # assertion actually runs — a zero-match glob there is silent at runtime.
        run: docker compose build web migrate worker

      - name: Apply migrations from the migrate image
        run: docker compose run --rm migrate

      - name: Start the stack
        run: docker compose up -d web worker

      - name: Wait for web and worker to report healthy
        # The worker's healthcheck is its Redis heartbeat, so this also proves
        # the shipped bundle booted and connected rather than merely started.
        run: |
          for _ in $(seq 1 60); do
            unhealthy=0
            for svc in web worker; do
              state=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q "$svc")" 2>/dev/null || echo starting)
              [ "$state" = "healthy" ] || unhealthy=1
            done
            if [ "$unhealthy" -eq 0 ]; then echo "web and worker healthy"; exit 0; fi
            sleep 5
          done
          echo "stack did not become healthy" >&2
          exit 1

      - name: Serve the public pages from the web image
        run: |
          set -euo pipefail
          # Read the network off the running container rather than matching a
          # name pattern: another compose project on the same host would match
          # too, and the checks would then quietly run against the wrong stack.
          net=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' \
            "$(docker compose ps -q web)" | tr ' ' '\n' | grep -m1 backend)
          for path in /api/health / /quote /contact /faq /materials /pricing; do
            code=$(docker run --rm --network "$net" curlimages/curl:8.11.1 \
              -s -o /dev/null -w '%{http_code}' "http://web:3000${path}")
            echo "$code  $path"
            [ "$code" = "200" ] || { echo "expected 200 for $path" >&2; exit 1; }
          done
          admin=$(docker run --rm --network "$net" curlimages/curl:8.11.1 \
            -s -o /dev/null -w '%{http_code}' "http://web:3000/admin")
          echo "$admin  /admin (admin gate)"
          [ "$admin" = "307" ] || { echo "admin gate did not redirect" >&2; exit 1; }

      - name: Slice a real model through the queue
        # No STUB_SLICER: this is OrcaSlicer, in the worker image, under the
        # slicer uid, reached only by enqueuing through the public API.
        run: |
          set -euo pipefail
          net=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' \
            "$(docker compose ps -q web)" | tr ' ' '\n' | grep -m1 backend)
          docker run --rm --network "$net" -v "$PWD:/workspace" -w /workspace \
            node:24 node apps/web/scripts/stack-slice-smoke.mjs http://web:3000 https://web:3000

      - name: Assert Orca staged inside the job sandbox
        # Regression guard for the 2026-08-11 outage: if this shared path exists,
        # some run resolved TMPDIR to the default temp dir and the next slice
        # under a different uid would fail at 97%.
        run: |
          if docker compose exec -T worker sh -c 'ls -d /tmp/orcaslicer_model' 2>/dev/null; then
            echo "Orca used the SHARED /tmp/orcaslicer_model; TMPDIR is not per-run" >&2
            exit 1
          fi
          echo "shared /tmp/orcaslicer_model absent, as expected"

      - name: Dump stack logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear the stack down
        if: always()
        run: docker compose down -v --remove-orphans

  codeql:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install and build
        run: |
          corepack enable
          corepack prepare pnpm@11.12.0 --activate
          pnpm install --frozen-lockfile
          pnpm build

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
