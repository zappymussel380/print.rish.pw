# Self-host overrides shared by every install.sh mode. Loaded through
# COMPOSE_FILE in the .env that install.sh writes — never by print.rish.pw's own
# deployment. Paths resolve from the repository root (the project directory).
services:
  # The main file's CPU limits suit the production host. Docker refuses to start
  # a container whose limit exceeds the machine's cores, so install.sh sizes
  # these to the server it runs on.
  #
  # The shop's printer: install.sh generates its profile set (machine, process
  # and filament profiles plus printer.json) into .selfhost/profiles from the
  # OrcaSlicer presets in the worker image. The worker slices with it; web reads
  # printer.json for the printer's name and build volume.
  #
  # Advanced mode (install.sh → "my own printer / profiles"): the owner uploads
  # OrcaSlicer presets in the admin dashboard; both services layer the live ones
  # over this set.
  web:
    environment:
      PRINTER_SPEC_FILE: /printer/printer.json
      ADVANCED_PROFILES: "${PRINTER_ADVANCED:-0}"
    volumes:
      - ./.selfhost/profiles:/printer:ro
    deploy:
      resources:
        limits:
          cpus: "${SELFHOST_WEB_CPUS:-2}"
  worker:
    environment:
      PROFILES_DIR: /printer
      ADVANCED_PROFILES: "${PRINTER_ADVANCED:-0}"
    volumes:
      - ./.selfhost/profiles:/printer:ro
    deploy:
      resources:
        limits:
          cpus: "${SELFHOST_WORKER_CPUS:-4}"
  postgres:
    deploy:
      resources:
        limits:
          cpus: "${SELFHOST_DB_CPUS:-2}"

  # One-off helper image (admin password hashing). Built on demand by
  # install.sh, run with no network, and removed again straight after.
  tools:
    profiles: ["tools"]
    image: print-tools
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: tools
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
