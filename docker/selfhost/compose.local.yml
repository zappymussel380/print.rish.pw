# Local test mode: the whole site over plain HTTP, on this computer
# (http://localhost:${LOCAL_PORT}) or also on its home network
# (http://<LOCAL_BIND>:${LOCAL_PORT}). Caddy is published on LOCAL_BIND alone —
# 127.0.0.1, or one private address the installer checked belongs to this
# computer — never on every address, so nothing on the internet can reach it.
# It stays the one trusted edge in front of the compose nginx
# (TRUSTED_PROXY_CIDR = its fixed address), as in every mode.
services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    depends_on:
      - proxy
    ports:
      - "${LOCAL_BIND:-127.0.0.1}:${LOCAL_PORT:-8000}:80"
    volumes:
      - ./.selfhost/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: ${EDGE_CADDY_IP:?Run ./install.sh}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped

networks:
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:?Run ./install.sh}

volumes:
  caddy_data:
  caddy_config:
