# HTTPS through a Cloudflare Tunnel, for servers with no public IP or open
# ports. cloudflared dials out to Cloudflare; Caddy (plain HTTP, reachable only
# from cloudflared) turns Cloudflare's CF-Connecting-IP into the X-Real-IP the
# compose nginx trusts from exactly one peer — Caddy's fixed address.
services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    depends_on:
      - proxy
    volumes:
      - ./.selfhost/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: ${EDGE_CADDY_IP:?Run ./install.sh}
      tunnel:
        ipv4_address: ${TUNNEL_CADDY_IP:?Run ./install.sh}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Run ./install.sh}
    depends_on:
      - caddy
    networks:
      tunnel:
        ipv4_address: ${TUNNEL_CLOUDFLARED_IP:?Run ./install.sh}
    read_only: true
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

networks:
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:?Run ./install.sh}
  tunnel:
    ipam:
      config:
        - subnet: ${TUNNEL_SUBNET:?Run ./install.sh}

volumes:
  caddy_data:
  caddy_config:
